---
name: Blacksmith BPF Integration

"on":
  workflow_dispatch:
  # Let release-sensor reuse this as a Blacksmith runner compatibility gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: blacksmith-bpf-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bpf-integration:
    name: BPF integration
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install BPF integration deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils gh libnss-resolve nodejs npm python3 python3-pip python3-requests wget

      - name: Environment info
        run: |
          {
            echo "## Blacksmith environment"
            echo '```'
            uname -a
            cat /etc/os-release
            go version
            for binary in curl python3 node npm wget git gh; do
              echo "$ $binary --version"
              "$binary" --version 2>&1 | head -n 3 || true
              path="$(command -v "$binary" || true)"
              [ -z "$path" ] || ldd "$(readlink -f "$path")" || true
            done
            echo '$ openssl version -a'
            if command -v openssl >/dev/null 2>&1; then
              openssl version -a
            else
              echo 'openssl CLI not installed'
            fi
            echo '$ python3 OpenSSL linkage'
            python3 -c 'import _ssl, requests, ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION); print(_ssl.__file__); print(requests.__version__)'
            python_ssl_module="$(python3 -c 'import _ssl; print(_ssl.__file__)')"
            ldd "$python_ssl_module"
            git_http_backend="$(git --exec-path)/git-remote-http"
            echo "git HTTP backend: $git_http_backend"
            ldd "$git_http_backend"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Probe fanotify capabilities
        run: |
          cat >/tmp/fanotify-capability-probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <string.h>
          #include <sys/fanotify.h>
          #include <unistd.h>

          struct probe {
              const char *name;
              unsigned int init_class;
              unsigned int mark_type;
              uint64_t event_mask;
              const char *path;
          };

          int main(void)
          {
              const struct probe probes[] = {
                  {"root permission/filesystem", FAN_CLASS_PRE_CONTENT, FAN_MARK_FILESYSTEM, FAN_OPEN_EXEC_PERM, "/"},
                  {"root notification/filesystem", FAN_CLASS_NOTIF, FAN_MARK_FILESYSTEM, FAN_OPEN_EXEC, "/"},
                  {"root permission/mount", FAN_CLASS_PRE_CONTENT, FAN_MARK_MOUNT, FAN_OPEN_EXEC_PERM, "/"},
                  {"root notification/mount", FAN_CLASS_NOTIF, FAN_MARK_MOUNT, FAN_OPEN_EXEC, "/"},
                  {"root permission/inode", FAN_CLASS_PRE_CONTENT, 0, FAN_OPEN_EXEC_PERM, "/bin/true"},
                  {"root notification/inode", FAN_CLASS_NOTIF, 0, FAN_OPEN_EXEC, "/bin/true"},
                  {"tmpfs permission/filesystem", FAN_CLASS_PRE_CONTENT, FAN_MARK_FILESYSTEM, FAN_OPEN_EXEC_PERM, "/mnt/cicd-sensor-fanotify-probe"},
                  {"tmpfs notification/filesystem", FAN_CLASS_NOTIF, FAN_MARK_FILESYSTEM, FAN_OPEN_EXEC, "/mnt/cicd-sensor-fanotify-probe"},
                  {"tmpfs permission/mount", FAN_CLASS_PRE_CONTENT, FAN_MARK_MOUNT, FAN_OPEN_EXEC_PERM, "/mnt/cicd-sensor-fanotify-probe"},
                  {"tmpfs notification/mount", FAN_CLASS_NOTIF, FAN_MARK_MOUNT, FAN_OPEN_EXEC, "/mnt/cicd-sensor-fanotify-probe"},
                  {"tmpfs permission/inode", FAN_CLASS_PRE_CONTENT, 0, FAN_OPEN_EXEC_PERM, "/mnt/cicd-sensor-fanotify-probe/true"},
                  {"tmpfs notification/inode", FAN_CLASS_NOTIF, 0, FAN_OPEN_EXEC, "/mnt/cicd-sensor-fanotify-probe/true"},
                  {"proc permission/filesystem", FAN_CLASS_PRE_CONTENT, FAN_MARK_FILESYSTEM, FAN_OPEN_EXEC_PERM, "/proc"},
                  {"proc notification/filesystem", FAN_CLASS_NOTIF, FAN_MARK_FILESYSTEM, FAN_OPEN_EXEC, "/proc"},
              };

              for (size_t i = 0; i < sizeof(probes) / sizeof(probes[0]); i++) {
                  errno = 0;
                  int fd = fanotify_init(probes[i].init_class | FAN_CLOEXEC | FAN_NONBLOCK,
                                         O_RDONLY | O_LARGEFILE | O_CLOEXEC);
                  if (fd < 0) {
                      printf("%-34s init=FAIL errno=%d (%s)\n",
                             probes[i].name, errno, strerror(errno));
                      continue;
                  }

                  errno = 0;
                  int rc = fanotify_mark(fd, FAN_MARK_ADD | probes[i].mark_type,
                                         probes[i].event_mask, AT_FDCWD, probes[i].path);
                  if (rc < 0) {
                      printf("%-34s init=OK mark=FAIL errno=%d (%s)\n",
                             probes[i].name, errno, strerror(errno));
                  } else {
                      printf("%-34s init=OK mark=OK\n", probes[i].name);
                  }
                  close(fd);
              }
              return 0;
          }
          EOF

          sudo mkdir -p /mnt/cicd-sensor-fanotify-probe
          sudo mount -t tmpfs -o size=1m cicd-sensor-fanotify-probe /mnt/cicd-sensor-fanotify-probe
          trap 'sudo umount /mnt/cicd-sensor-fanotify-probe; sudo rmdir /mnt/cicd-sensor-fanotify-probe' EXIT
          sudo cp /bin/true /mnt/cicd-sensor-fanotify-probe/true

          {
            echo '## fanotify capability probe'
            echo '```'
            findmnt -T / -o TARGET,FSTYPE,SOURCE,OPTIONS
            findmnt -T /bin/true -o TARGET,FSTYPE,SOURCE,OPTIONS
            stat -f -c 'path=/ type=%T magic=0x%t' /
            stat -f -c 'path=/bin/true type=%T magic=0x%t' /bin/true
            findmnt -T /mnt/cicd-sensor-fanotify-probe -o TARGET,FSTYPE,SOURCE,OPTIONS
            stat -f -c 'path=/mnt/cicd-sensor-fanotify-probe type=%T magic=0x%t' /mnt/cicd-sensor-fanotify-probe
            stat -f -c 'path=/proc type=%T magic=0x%t' /proc
            config="/boot/config-$(uname -r)"
            if [ -r "$config" ]; then
              grep '^CONFIG_FANOTIFY' "$config" || true
            elif [ -r /proc/config.gz ]; then
              zgrep '^CONFIG_FANOTIFY' /proc/config.gz || true
            else
              echo 'kernel fanotify config: unavailable'
            fi
            cc -O2 -Wall -Wextra -Werror /tmp/fanotify-capability-probe.c -o /tmp/fanotify-capability-probe
            sudo /tmp/fanotify-capability-probe
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run BPF integration tests
        run: |
          make bpf-integration SUDO=sudo

      - name: Build HTTP client coverage test
        run: |
          CGO_ENABLED=0 go test -mod=vendor -c -tags 'bpf_integration http_client_integration' \
            -o /tmp/http-client-coverage.test ./internal/agent/kerneltracker
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' \
            -o /tmp/go-http-client ./internal/agent/kerneltracker/testdata/go_http_client
          CGO_ENABLED=1 go build -buildvcs=false -trimpath -buildmode=pie \
            -ldflags='-s -w -linkmode=external' \
            -o /tmp/go-http-cgo-client ./internal/agent/kerneltracker/testdata/go_http_client

      - name: Run HTTP client coverage test
        env:
          HTTP_UPROBE_EXPECTED_CLIENTS: curl,python_urllib,python_requests,pip,node,npm,wget
        run: |
          sudo HTTP_UPROBE_EXPECTED_CLIENTS="$HTTP_UPROBE_EXPECTED_CLIENTS" \
            GO_HTTP_TEST_CLIENT=/tmp/go-http-client \
            GO_HTTP_CGO_TEST_CLIENT=/tmp/go-http-cgo-client \
            /tmp/http-client-coverage.test \
            -test.v \
            -test.count=1 \
            -test.timeout=10m \
            -test.run '^TestLinux(OpenSSLUprobeCoversCommonClients|Nghttp2UprobeCoversHTTP2Clients|GoNetHTTPUprobe(CapturesHTTPS|CapturesExternallyLinkedHTTPS|CoversGH))$'

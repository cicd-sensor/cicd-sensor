---
name: Blacksmith BPF Integration

"on":
  workflow_dispatch:
  # Let release-sensor reuse this as a Blacksmith runner compatibility gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: blacksmith-bpf-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bpf-integration:
    name: BPF integration
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    env:
      GOCACHE: ${{ github.workspace }}/.gocache
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install BPF integration deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils libnss-resolve python3

      - name: Environment info
        run: |
          {
            echo "## Blacksmith environment"
            echo '```'
            uname -a
            cat /etc/os-release
            go version
            echo '$ curl --version'
            curl --version
            curl_path="$(command -v curl)"
            printf '$ curl binary: %s -> %s\n' "$curl_path" "$(readlink -f "$curl_path")"
            ldd "$curl_path"
            echo '$ openssl version -a'
            if command -v openssl >/dev/null 2>&1; then
              openssl version -a
            else
              echo 'openssl CLI not installed'
            fi
            echo '$ python3 OpenSSL linkage'
            python3 -c 'import _ssl, ssl, sys; print(sys.version); print(ssl.OPENSSL_VERSION); print(_ssl.__file__)'
            python_ssl_module="$(python3 -c 'import _ssl; print(_ssl.__file__)')"
            ldd "$python_ssl_module"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run BPF integration tests
        run: |
          make bpf-integration SUDO=sudo

---
name: BPF Cross-Kernel Integration

"on":
  workflow_dispatch:
  # Auto-run on main when Go (or BPF source) actually changes, so the
  # cross-kernel verifier check covers every merge that could affect
  # the loaded program bytes. PRs still rely on workflow_dispatch /
  # the calling release workflow to avoid burning LVH minutes on
  # every iteration.
  push:
    branches:
      - main
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'vendor/**'
      - 'internal/agent/bpf/**'
      - 'Makefile'
      - '.github/workflows/bpf-cross-kernel.yaml'
  # Let release-sensor reuse this as an integration gate.
  workflow_call:

permissions:
  contents: read

jobs:
  http-client-coverage:
    name: "HTTP client coverage on ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            experimental: false
            expected: curl,python_urllib,python_requests,pip,node,npm,wget
          - runner: ubuntu-24.04
            experimental: false
            expected: curl,python_urllib,python_requests,pip,node,npm,wget
          - runner: ubuntu-26.04
            experimental: true
            expected: curl,python_urllib,python_requests,pip,node,npm
          - runner: ubuntu-22.04-arm
            experimental: false
            expected: curl,python_urllib,python_requests,pip,node,npm,wget
          - runner: ubuntu-24.04-arm
            experimental: false
            expected: curl,python_urllib,python_requests,pip,node,npm,wget
          - runner: ubuntu-26.04-arm
            experimental: true
            expected: curl,python_urllib,python_requests,pip,node,npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install HTTP clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gh nodejs npm python3-pip python3-requests wget

      - name: Client environment
        run: |
          uname -a
          cat /etc/os-release
          for binary in curl python3 node npm wget git gh; do
            echo "$ $binary --version"
            "$binary" --version 2>&1 | head -n 3 || true
            path="$(command -v "$binary" || true)"
            [ -z "$path" ] || ldd "$(readlink -f "$path")" || true
          done
          python3 -c 'import _ssl, requests, ssl; print("python ssl:", ssl.OPENSSL_VERSION); print("python _ssl:", _ssl.__file__); print("requests:", requests.__version__)'
          python_ssl_module="$(python3 -c 'import _ssl; print(_ssl.__file__)')"
          ldd "$python_ssl_module"
          git_http_backend="$(git --exec-path)/git-remote-http"
          echo "git HTTP backend: $git_http_backend"
          ldd "$git_http_backend"

      - name: Build HTTP client coverage test
        run: |
          CGO_ENABLED=0 go test -mod=vendor -c -tags 'bpf_integration http_client_integration' \
            -o /tmp/http-client-coverage.test ./internal/agent/kerneltracker
          CGO_ENABLED=0 go build -buildvcs=false -trimpath -ldflags='-s -w' \
            -o /tmp/go-http-client ./internal/agent/kerneltracker/testdata/go_http_client
          CGO_ENABLED=1 go build -buildvcs=false -trimpath -buildmode=pie \
            -ldflags='-s -w -linkmode=external' \
            -o /tmp/go-http-cgo-client ./internal/agent/kerneltracker/testdata/go_http_client

      - name: Run HTTP client coverage test
        env:
          HTTP_UPROBE_EXPECTED_CLIENTS: ${{ matrix.expected }}
        run: |
          sudo HTTP_UPROBE_EXPECTED_CLIENTS="$HTTP_UPROBE_EXPECTED_CLIENTS" \
            GO_HTTP_TEST_CLIENT=/tmp/go-http-client \
            GO_HTTP_CGO_TEST_CLIENT=/tmp/go-http-cgo-client \
            /tmp/http-client-coverage.test \
            -test.v \
            -test.count=1 \
            -test.timeout=10m \
            -test.run '^TestLinux(OpenSSLUprobeCoversCommonClients|Nghttp2UprobeCoversHTTP2Clients|GoNetHTTPUprobe(CapturesHTTPS|CapturesExternallyLinkedHTTPS|CoversGH))$'

  go-http-version-coverage:
    name: "Go HTTP versions on ${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Go version coverage
        run: |
          CGO_ENABLED=0 go test -mod=vendor -c -tags 'bpf_integration http_client_integration' \
            -o /tmp/go-http-version-coverage.test ./internal/agent/kerneltracker
          versioned_clients=()
          # Pin the supported minimum, pclntab layout boundaries, and latest release.
          for version in 1.18.10 1.20.14 1.26.7 1.27.0; do
            goroot="$(env -u GOROOT GOTOOLCHAIN="go${version}" go env GOROOT)"
            output="/tmp/go-http-${version}"
            env -u GOROOT GO111MODULE=off GOTOOLCHAIN=local CGO_ENABLED=0 "$goroot/bin/go" build \
              -trimpath -ldflags='-s -w' \
              -o "$output" ./internal/agent/kerneltracker/testdata/go_http_client
            "$goroot/bin/go" version -m "$output" | grep -F "go${version}"
            versioned_clients+=("go${version}-internal=${output}")
            output="/tmp/go-http-cgo-${version}"
            env -u GOROOT GO111MODULE=off GOTOOLCHAIN=local CGO_ENABLED=1 CC=cc "$goroot/bin/go" build \
              -trimpath -buildmode=pie -ldflags='-s -w -linkmode=external' \
              -o "$output" ./internal/agent/kerneltracker/testdata/go_http_client
            "$goroot/bin/go" version -m "$output" | grep -F "go${version}"
            versioned_clients+=("go${version}-external=${output}")
          done
          printf 'GO_HTTP_VERSIONED_TEST_CLIENTS=%s\n' "$(IFS=,; echo "${versioned_clients[*]}")" >> "$GITHUB_ENV"

      - name: Run Go version coverage
        run: |
          sudo GO_HTTP_VERSIONED_TEST_CLIENTS="$GO_HTTP_VERSIONED_TEST_CLIENTS" \
            /tmp/go-http-version-coverage.test \
            -test.v \
            -test.count=1 \
            -test.timeout=10m \
            -test.run '^TestLinuxGoNetHTTPUprobeCoversSupportedGoVersions$'

  kernel:
    name: "x64 kernel ${{ matrix.kernel.label }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Pin LVH kernel image tags so upstream rebuilds cannot silently
        # change the verifier target. Bump by checking quay.io/lvh-images/kind.
        # LVH runs on GitHub-hosted x64 runners because KVM access and the
        # published kind images are x64-only in this workflow.
        kernel:
          - label: "5.15"
            version: "5.15-20260416.033356"
          - label: "6.18"
            version: "6.18-20260504.013701"
    env:
      LVH_IMAGE: kind
      KERNELTRACKER_INTEGRATION_TEST_BIN: _lvh/tests/kerneltracker.test
      KERNELIO_INTEGRATION_TEST_BIN: _lvh/tests/kernelio.test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install BPF build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm

      - name: Enable KVM for LVH
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Environment info
        run: |
          {
            echo "## Host environment for kernel ${{ matrix.kernel.label }}"
            echo '```'
            uname -a
            cat /etc/os-release
            go version
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify generated BPF bindings
        run: |
          make generate-bpf
          # Only check Go bindings. The .o file can differ by clang/llvm-strip
          # metadata across runners even when embedded program bytes are stable.
          if ! git diff --exit-code 'internal/agent/bpf/generated/*.go'; then
            echo "::error::BPF Go bindings drifted. Run 'make generate-bpf' locally and commit."
            exit 1
          fi

      - name: Build integration test binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p _lvh/tests
          GOOS=linux GOARCH=amd64 go test -mod=vendor -c -tags bpf_integration -o "$KERNELTRACKER_INTEGRATION_TEST_BIN" ./internal/agent/kerneltracker
          GOOS=linux GOARCH=amd64 go test -mod=vendor -c -tags bpf_integration -o "$KERNELIO_INTEGRATION_TEST_BIN" ./internal/agent/kerneltracker/kernelio
          for bin in "$KERNELTRACKER_INTEGRATION_TEST_BIN" "$KERNELIO_INTEGRATION_TEST_BIN"; do
            file "$bin" | tee -a "$GITHUB_STEP_SUMMARY"
            if ! file "$bin" | grep -q 'statically linked'; then
              echo "::error::integration test binary is not statically linked; LVH rootfs cannot run it"
              exit 1
            fi
          done

      - name: "Run integration tests on kernel ${{ matrix.kernel.label }}"
        uses: cilium/little-vm-helper@5ae749011735fd77f30f38add52f1a53a5568671 # v0.0.30
        with:
          test-name: "bpf-integration-${{ matrix.kernel.label }}"
          image: ${{ env.LVH_IMAGE }}
          image-version: ${{ matrix.kernel.version }}
          host-mount: ./
          # The action caches its apt .deb set (lvh-pkgs-*) keyed only on
          # top-level dep versions (upstream PR #515), so a transitive systemd
          # bump can leave it stale and fail apt. Fix: delete the lvh-pkgs-*
          # cache (gh cache delete) and re-run.
          install-dependencies: 'true'
          # LVH interpolates this through a shell; escape literal $ as \$.
          # The kind rootfs is minimal, so install DNS/NSS packages for DNS and
          # systemd-resolved tests plus both OpenSSL E2E clients. Use /dev/shm
          # to avoid overlayfs dentries in file path tests.
          cmd: |
            set -eo pipefail
            cd /host
            mkdir -p /host/_lvh/logs
            log=/host/_lvh/logs/bpf-integration-${{ matrix.kernel.label }}.log
            : >"\$log"
            uname -a | tee -a "\$log"
            test -e /sys/kernel/btf/vmlinux && echo "BTF: present" | tee -a "\$log"
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q | tee -a "\$log"
            apt-get install -y -q curl dnsutils libnss-resolve python3 | tee -a "\$log"
            export TMPDIR=/dev/shm
            /host/${{ env.KERNELTRACKER_INTEGRATION_TEST_BIN }} -test.v -test.count=1 -test.timeout=15m 2>&1 | tee -a "\$log"
            /host/${{ env.KERNELIO_INTEGRATION_TEST_BIN }} -test.v -test.count=1 -test.timeout=15m 2>&1 | tee -a "\$log"

      - name: Reject unexpected skips
        run: |
          log="_lvh/logs/bpf-integration-${{ matrix.kernel.label }}.log"
          if [ ! -s "$log" ]; then
            echo "::error::LVH log not produced at $log"
            exit 1
          fi
          skips="$(grep -E '^[[:space:]]*--- SKIP:' "$log" \
            | grep -v 'real_var_run_docker_upstream_sock_if_proxy_deployed' || true)"
          if [ -n "$skips" ]; then
            {
              echo "## Skipped tests on LVH ${{ matrix.kernel.label }}"
              echo '```'
              printf '%s\n' "$skips"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::error::LVH ${{ matrix.kernel.label }} run contains skipped tests."
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "bpf-integration-${{ matrix.kernel.label }}"
          path: "_lvh/logs/*.log"
          if-no-files-found: ignore

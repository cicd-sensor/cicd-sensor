  push:
    branches: [aca-manager]
    paths: [.github/workflows/cicd-sensor-test.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: cicd-sensor/cicd-sensor-action@2bc31a18949a77cd5f5bd452f24f00fbb507cdf6 # v0.0.41
        with:
          manager-url: https://cicdsensor-manager.wittybeach-6af2bcb2.japaneast.azurecontainerapps.io
          manager-token: ${{ secrets.CICD_SENSOR_MANAGER_TOKEN }}
      - run: |
          echo "hello from cicd-sensor test"
          curl -sS -o /dev/null https://example.com
          cat /etc/hostname

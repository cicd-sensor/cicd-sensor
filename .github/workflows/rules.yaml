---
name: Rules

"on":
  pull_request:
    paths:
      - rules/**
      - .github/workflows/rules.yaml
  push:
    branches:
      - main
    paths:
      - rules/**
      - .github/workflows/rules.yaml

permissions:
  contents: read

concurrency:
  group: rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test rule behavior
        run: make rules-test
      - name: Validate rules
        run: make rules-validate
      - name: Validate bundled rules
        run: make rules-bundle-validate

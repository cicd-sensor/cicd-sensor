rule_sets:
  - ruleset_id: cicd_sensor_baseline/ioc
    # Short-lived, high-confidence campaign indicators live here.

    rules:
      - rule_id: mini_shaihulud_antv_c2_domain
        rule_name: "IOC: Mini Shai-Hulud AntV C2 domain"
        description: |
          What:
            Terminates lookup of a Mini Shai-Hulud AntV campaign C2 domain reported by Chainguard in May 2026.
          Why:
            This is a specific active-compromise IOC, not a general behavior rule.
          Notes:
            Preserve job logs and artifacts, then rotate credentials reachable from the job.
        event_type: domain
        condition: domain == "t.m-kosche.com"
        action: terminate
        tags:
          mitre_tactic: command-and-control
          ioc_date: "2026-05-19"
          source_url: https://www.chainguard.dev/unchained/mini-shai-hulud-npm-attack-antv-ecosystem-compromise-may-2026

      - rule_id: mastra_npm_compromise_c2_ip
        rule_name: "IOC: Mastra npm package compromise C2 IP"
        description: |
          What:
            Outbound C2 connections from the @mastra/* npm package compromise.
          Why:
            Active-compromise IOC. Compromised @mastra packages beacon to these IPs.
        event_type: network_connect
        condition: |
          family == "ipv4" &&
          (
            remote_ip == "23.254.164.92" ||
            remote_ip == "23.254.164.123"
          )
        action: terminate
        tags:
          mitre_tactic: command-and-control
          ioc_date: "2026-06-17"
          source_url: https://x.com/lmt_swallow/status/2067082668458786967

      - rule_id: asyncapi_npm_compromise_c2_ip
        rule_name: "IOC: AsyncAPI npm package compromise C2 IP"
        description: |
          What:
            Outbound C2 connections from the @asyncapi npm package compromise
            (@asyncapi/specs, @asyncapi/generator, @asyncapi/generator-helpers,
            @asyncapi/generator-components).
          Why:
            Active-compromise IOC. Compromised @asyncapi packages beacon to these IPs.
          Notes:
            Preserve job logs and artifacts, then rotate credentials reachable from the job.
        event_type: network_connect
        condition: |
          family == "ipv4" &&
          (
            remote_ip == "209.94.90.1" ||
            remote_ip == "85.137.53.71"
          )
        action: terminate
        tags:
          mitre_tactic: command-and-control
          ioc_date: "2026-07-14"
          source_url: https://x.com/lmt_swallow/status/2076943312909672912

      - rule_id: asyncapi_miasma_dht_bootstrap_domain
        rule_name: "IOC: Miasma BitTorrent DHT bootstrap resolution"
        description: |
          What:
            DNS resolution of public BitTorrent DHT bootstrap nodes, used by
            the @asyncapi npm compromise stage 2 (Miasma variant) as a C2
            rendezvous channel.
          Why:
            Active-compromise IOC in the current campaign. The domains are
            legitimate DHT bootstrap infrastructure, but a CI job has no
            ordinary reason to join the BitTorrent DHT, so resolution from a
            tracked job is treated as compromise.
          Notes:
            Projects that legitimately exercise BitTorrent clients in CI
            should exclude this rule with a rule modifier. Preserve job logs
            and artifacts, then rotate credentials reachable from the job.
        event_type: domain
        condition: |
          domain == "router.bittorrent.com" ||
          domain == "dht.transmissionbt.com"
        action: terminate
        tags:
          mitre_tactic: command-and-control
          ioc_date: "2026-07-14"
          source_url: https://x.com/lmt_swallow/status/2076945835313840559

      - rule_id: miasma_systemd_unit_write
        rule_name: "IOC: Miasma systemd persistence write"
        description: |
          What:
            Write below a systemd directory whose path contains "miasma",
            covering the @asyncapi npm compromise stage 2 persistence unit
            (~/.config/systemd/user/miasma-monitor.service) and renamed
            variants of the same worm family.
          Why:
            Active-compromise IOC. The Miasma lineage persists through a
            systemd unit carrying its family name; no legitimate CI write
            matches both fragments.
          Notes:
            Generic user-systemd persistence rules still cover arbitrary unit
            names and renamed or linked landings at detect level. Preserve job
            logs and artifacts, then rotate credentials reachable from the job.
        event_type: file_open
        condition: |
          is_write &&
          path.contains("/systemd/") &&
          path.contains("miasma")
        action: terminate
        tags:
          mitre_tactic: persistence
          ioc_date: "2026-07-14"
          source_url: https://x.com/lmt_swallow/status/2076945835313840559
